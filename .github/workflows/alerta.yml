name: Notificacion DevOps Hola Mundo 

on:
  push:
    branches:
      - main

jobs:
  notificacion-hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificacion
        run: |
          curl -H "Title: Hola Mundo - Mario Sabala 2025-1035" \
               -d "Se ha subido nuevo codigo al repositorio" \
               https://ntfy.sh/devops-itla